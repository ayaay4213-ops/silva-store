# Deploy SILVA to GitHub Pages with browser-compatible MP4 video files
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare browser-compatible videos
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg

          for f in \
            "VID-20261007-WA0078.mp4" \
            "VID_20261004153205202.mp4" \
            "lv_0_20261004143659.mp4" \
            "lv_0_٢٠٢٦٠٩٠٧٠٣٤١٣٥.mp4"
          do
            if [ -f "$f" ]; then
              echo "Converting $f"
              tmp="${f%.mp4}.web.mp4"
              ffmpeg -y -i "$f" \
                -map 0:v:0 -map 0:a? \
                -c:v libx264 -preset veryfast -crf 23 -pix_fmt yuv420p \
                -c:a aac -b:a 128k \
                -movflags +faststart \
                "$tmp"
              mv "$tmp" "$f"
            fi
          done

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
