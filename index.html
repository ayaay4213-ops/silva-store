<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Silva | متجرك الرقمي الراقي</title>
<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
:root{--gold:#d8b35a;--gold2:#f5d889;--ink:#090909;--panel:#17120d}
body{margin:0;font-family:Arial,Tahoma,sans-serif;color:#fff;background:#120f0d;position:relative;isolation:isolate}
body:before{content:"";position:fixed;inset:-35px;z-index:-2;background:url("./silva-new-hero.jpg") center/cover no-repeat;filter:blur(22px);transform:scale(1.08);opacity:.9}
body:after{content:"";position:fixed;inset:0;z-index:-1;background:rgba(30,20,12,.28);pointer-events:none}
button,a{font-family:inherit}
header{position:sticky;top:0;z-index:50;height:76px;padding:10px 5%;display:flex;align-items:center;justify-content:space-between;background:rgba(24,17,12,.42);backdrop-filter:blur(12px);border-bottom:1px solid rgba(235,198,101,.35)}
.logo{font-size:31px;font-weight:900;letter-spacing:1px;text-shadow:0 2px 12px #000}
.cart{border:1px solid var(--gold);background:linear-gradient(135deg,#1e1731,#252c62);color:#fff;border-radius:17px;padding:12px 22px;font-weight:900;font-size:16px;box-shadow:0 8px 25px #0006;cursor:pointer}
.adminLink{display:none}
.topMarks{height:52px;display:flex;align-items:center;justify-content:center;gap:18px;font-size:34px;font-weight:900;color:#fff;filter:drop-shadow(0 3px 8px #000)}
.topMarks span{display:block;width:58px;height:10px;background:#fff;border-radius:99px;transform:rotate(-7deg)}
.topMarks span:nth-child(2){width:45px;transform:rotate(-4deg)}
.topMarks span:nth-child(3){width:34px;transform:rotate(-7deg)}
.hero{padding:0 4.5% 28px;max-width:1180px;margin:0 auto}
.heroFrame{position:relative;overflow:hidden;height:clamp(250px,43vw,470px);border:2px solid rgba(220,181,76,.9);border-radius:25px;background:rgba(15,12,10,.35);box-shadow:0 18px 55px #0009,inset 0 0 0 1px #fff2}
.heroFrame:before{content:"";position:absolute;inset:0;background:url("./silva-new-hero.jpg") center 36%/cover no-repeat;filter:saturate(1.12);opacity:.98}
.heroFrame:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,3,2,.02),rgba(5,4,3,.06) 55%,rgba(5,4,3,.36));pointer-events:none}
.heroBrand{position:absolute;top:18px;right:20px;z-index:4;font-weight:900;font-size:clamp(20px,3vw,30px);color:#f5d889;text-shadow:0 2px 8px #000}
.heroBrand small{display:block;font-size:clamp(10px,1.5vw,14px);color:#fff;margin-top:4px}
.heroContent{position:relative;z-index:5;margin:18px auto 14px;max-width:720px;display:flex;flex-direction:column;align-items:center;text-align:center;padding:22px 20px;background:rgba(13,9,7,.82);border:1px solid rgba(222,181,76,.65);border-radius:20px;box-shadow:0 12px 32px #0006}
.badge{display:inline-flex;align-items:center;gap:7px;padding:8px 15px;border-radius:30px;background:#251b10;border:1px solid var(--gold);color:#f5d889;font-weight:900;font-size:13px}
.hero h1{font-size:clamp(36px,7vw,62px);margin:10px 0 3px;line-height:1;text-shadow:0 5px 20px #000}
.hero h2{font-size:clamp(21px,3.5vw,30px);margin:0 0 8px}
.hero p{max-width:560px;margin:0;color:#f2e8d4;font-size:17px;line-height:1.8}
.btn{margin-top:16px;display:inline-block;padding:13px 28px;border-radius:15px;background:#fff;color:#16120d;text-decoration:none;font-weight:900;box-shadow:0 8px 25px #0007}
.heroTiles{position:relative;z-index:5;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:14px 0 0}
.heroTile{min-height:116px;border:1px solid #e6bd56;border-radius:16px;overflow:hidden;background:linear-gradient(145deg,rgba(12,8,20,.94),rgba(4,5,12,.96));box-shadow:0 0 0 1px #fff2 inset,0 9px 22px #0009;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;text-align:center;cursor:pointer;transition:transform .2s,border-color .2s}
.heroTile .tileIcon{font-size:42px;line-height:1;margin:auto 0 7px;filter:drop-shadow(0 0 10px #4c9dff)}
.heroTile b{width:100%;padding:11px 5px;background:linear-gradient(90deg,#100c08ee,#33220eee,#100c08ee);color:#f8e2a0;font-size:15px;border-top:1px solid #c99a3b}
.heroTile:hover{transform:translateY(-3px);border-color:#ffe39b}
.heroStrip{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px auto 0;max-width:800px}
.stripItem{min-width:120px;padding:11px 16px;border:1px solid #a57b2d;border-radius:13px;background:rgba(15,12,10,.88);color:#f6df9c;font-weight:900;font-size:13px}
.title{padding:28px 6% 8px;display:flex;justify-content:space-between;align-items:end;gap:20px}
.title h2{margin:0;font-size:31px;text-shadow:0 3px 12px #000}
.title p{margin:0;color:#eee0c6}
.filters{display:flex;gap:10px;flex-wrap:wrap;padding:10px 6% 16px}
.filter{border:1px solid #a9843a;background:rgba(28,21,14,.78);color:#fff;border-radius:15px;padding:11px 17px;cursor:pointer;font-weight:900;box-shadow:0 6px 15px #0005}
.filter.active{background:#fff;color:#2a1c0b;border-color:#fff}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;padding:10px 6% 70px}
.card{background:rgba(18,14,11,.9);border:1px solid #745625;border-radius:20px;overflow:hidden;box-shadow:0 15px 38px #0008;transition:.25s}
.card:hover{transform:translateY(-5px);border-color:#e0bd61}
.productVisual{height:190px;position:relative;overflow:hidden;background:#090a0d}
.productSprite{position:absolute;inset:0;background-image:url('./products/silva-sprite.jpg');background-size:200% 200%;background-repeat:no-repeat}
.sprite0{background-position:0 0}.sprite1{background-position:100% 0}.sprite2{background-position:0 100%}.sprite3{background-position:100% 100%}
.videoPreview{width:100%;height:100%;position:relative;cursor:pointer;background:#08090c;overflow:hidden}
.videoPreviewPlay{position:absolute;inset:0;display:grid;place-items:center;font-size:42px;text-shadow:0 4px 20px #000;background:radial-gradient(circle,rgba(210,160,35,.25),transparent 55%)}
.videoPreviewLabel{position:absolute;bottom:10px;right:10px;padding:6px 9px;border-radius:9px;background:#0b0a08dd;border:1px solid #80652f;font-size:11px;font-weight:900}
.pic{height:100%;display:grid;place-items:center;font-size:60px}
.info{padding:16px}.info h3{margin:0 0 7px;font-size:19px}.info p{color:#cfc4b2;line-height:1.6;min-height:43px}.price{font-size:21px;font-weight:900;color:#f4d47c;margin-top:12px}.add{width:100%;margin-top:13px;padding:12px;border:1px solid #d4ad50;border-radius:12px;background:linear-gradient(135deg,#fff,#eadbb7);color:#16120d;font-weight:900;cursor:pointer}
footer{text-align:center;padding:34px 6%;border-top:1px solid #5d4825;color:#c9b98e;background:rgba(10,8,7,.35)}
.cartBox{position:fixed;top:0;right:-100%;width:min(420px,92%);height:100vh;background:#120f0c;z-index:100;box-shadow:-15px 0 50px #0009;transition:.3s;display:flex;flex-direction:column;border-left:1px solid #a17b35}
.cartBox.open{right:0}.cartHead{padding:20px;border-bottom:1px solid #5d4825;display:flex;justify-content:space-between;align-items:center}.cartHead h2{margin:0}.close{background:#2b2115;color:#fff;border:1px solid #80652f;border-radius:10px;padding:8px 12px;font-size:18px;cursor:pointer}.cartItems{flex:1;overflow:auto;padding:15px}.empty{text-align:center;color:#aaa;margin-top:60px}.cartItem{background:#1c1711;border:1px solid #574421;border-radius:14px;padding:13px;margin-bottom:12px}.cartItem strong{display:block;margin-bottom:8px}.itemPrice{color:#efd27d;font-weight:bold}.controls{display:flex;align-items:center;gap:8px;margin-top:10px}.controls button{width:32px;height:32px;border:0;border-radius:8px;background:#332717;color:#fff;font-size:18px;cursor:pointer}.remove{margin-right:auto;background:#4b2027!important;color:#ffb5bd!important;font-size:13px!important;width:auto!important;padding:0 10px}.total{padding:18px;border-top:1px solid #5d4825;background:#0d0b09}.totalRow{display:flex;justify-content:space-between;font-size:20px;font-weight:bold;margin-bottom:14px}.checkout{width:100%;padding:13px;border:0;border-radius:12px;background:#25D366;color:#fff;font-weight:900;cursor:pointer;font-size:16px}.overlay{position:fixed;inset:0;background:#0008;z-index:90;display:none}.overlay.show{display:block}
#msg{position:fixed;bottom:22px;left:5%;right:5%;z-index:120;background:#fff;color:#111;padding:15px;border-radius:14px;text-align:center;font-weight:bold;display:none;box-shadow:0 15px 40px #0009}
.videoModal{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.9);backdrop-filter:blur(8px)}.videoModal.open{display:flex}.videoModalBox{width:min(960px,96vw);max-height:94vh;background:#0d0f15;border:1px solid #80652f;border-radius:20px;overflow:hidden;box-shadow:0 25px 80px #000;position:relative}.videoModal video{display:block;width:100%;max-height:82vh;background:#000;object-fit:contain}.videoModalClose{position:absolute;top:10px;left:10px;z-index:3;width:42px;height:42px;border:1px solid #ffffff44;border-radius:50%;background:#111827dd;color:#fff;font-size:26px;cursor:pointer}.videoModalTitle{padding:13px 18px;font-weight:900;color:#fff}
@media(max-width:700px){
header{height:68px;padding:9px 4%}.logo{font-size:28px}.cart{padding:10px 15px;font-size:14px}.topMarks{height:42px;gap:10px}.topMarks span{width:43px;height:8px}.topMarks span:nth-child(2){width:34px}.topMarks span:nth-child(3){width:26px}
.hero{padding:0 3% 18px}.heroFrame{height:270px;border-radius:18px}.heroFrame:before{background-position:34% center}.heroBrand{top:12px;right:12px;font-size:19px}.heroBrand small{font-size:10px}
.heroContent{margin:12px auto;padding:16px 12px;border-radius:16px}.hero h1{font-size:34px;margin:7px 0 3px}.hero h2{font-size:20px;margin-bottom:5px}.hero p{font-size:14px;line-height:1.6}.btn{margin-top:11px;padding:11px 20px}
.heroTiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}.heroTile{min-height:100px;border-radius:12px}.heroTile .tileIcon{font-size:34px}.heroTile b{font-size:12px;padding:8px 4px}
.heroStrip{gap:6px;margin-top:10px}.stripItem{min-width:0;flex:1 1 28%;padding:9px 7px;font-size:11px;text-align:center}
.title{padding:24px 5% 8px;display:block}.title h2{font-size:28px}.title p{margin-top:5px}.filters{padding:9px 5% 15px;gap:7px;overflow:auto;flex-wrap:nowrap}.filter{white-space:nowrap;padding:9px 13px;font-size:12px}.products{grid-template-columns:1fr 1fr;padding:8px 4% 55px;gap:11px}.productVisual{height:145px}.info{padding:12px}.info h3{font-size:16px}.info p{font-size:12px;min-height:38px}.price{font-size:18px}.add{padding:10px;font-size:13px}
}
@media(max-width:390px){.heroFrame{height:235px}.heroTiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.heroTile{min-height:90px}.heroContent{padding:14px 10px}.hero p{font-size:13px}.products{grid-template-columns:1fr}}

</style>
</head>
