<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Silva | متجرك الرقمي الراقي</title>

<style>
*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:Arial,Tahoma,sans-serif;
  background:#07080c;
  color:#fff;
}

/* ================= HEADER ================= */

header{
  position:sticky;
  top:0;
  z-index:20;
  padding:15px 6%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#08090ddd;
  backdrop-filter:blur(16px);
  border-bottom:1px solid #292b36;
}

.logo{
  font-size:27px;
  font-weight:900;
  letter-spacing:1px;
}

.cart{
  background:#171923;
  color:#fff;
  border:1px solid #414451;
  padding:11px 17px;
  border-radius:14px;
  font-weight:bold;
  cursor:pointer;
}

/* ================= HERO ================= */

.hero{
  min-height:650px;
  position:relative;
  overflow:hidden;
  display:flex;
  align-items:center;
  padding:70px 7%;

  background:
    linear-gradient(
      90deg,
      #050505 0%,
      #050505 30%,
      rgba(5,5,5,.72) 46%,
      rgba(5,5,5,.15) 68%,
      rgba(5,5,5,0) 100%
    ),
    url("./file_00000000b4608243b58dced485d619f0.png")
    right center / 58% auto
    no-repeat;

  background-color:#050505;
}

.hero::after{
  content:"";
  position:absolute;
  inset:0;

  background:
    linear-gradient(
      180deg,
      transparent 60%,
      #070707 100%
    );

  pointer-events:none;
}

.heroContent{
  position:relative;
  z-index:2;
  max-width:580px;
}

.badge{
  display:inline-block;
  padding:8px 14px;
  border-radius:30px;
  background:#2b193d;
  border:1px solid #71489a;
  color:#e1c5ff;
  font-size:13px;
}

.hero h1{
  font-size:clamp(50px,11vw,86px);
  margin:18px 0 8px;
  line-height:1;
}

.hero h2{
  margin:0 0 12px;
  font-size:clamp(24px,4vw,38px);
}

.hero p{
  max-width:560px;
  color:#c4c7d2;
  font-size:19px;
  line-height:1.9;
}

.btn{
  display:inline-block;
  margin-top:18px;
  padding:14px 25px;
  border-radius:14px;
  background:#fff;
  color:#111;
  text-decoration:none;
  font-weight:900;
}

/* ================= PRODUCTS ================= */

.title{
  padding:38px 6% 12px;
}

.title h2{
  margin:0;
  font-size:30px;
}

.title p{
  color:#858b9b;
}

.filters{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  padding:10px 6% 15px;
}

.filter{
  border:1px solid #353945;
  background:#13151c;
  color:#fff;
  border-radius:12px;
  padding:10px 15px;
  cursor:pointer;
}

.filter.active{
  background:#fff;
  color:#111;
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:18px;
  padding:15px 6% 70px;
}

.card{
  background:#12141b;
  border:1px solid #292d38;
  border-radius:22px;
  overflow:hidden;
  box-shadow:0 18px 45px #0005;
  transition:.25s;
}

.card:hover{
  transform:translateY(-6px);
  border-color:#7650a0;
}

.pic{
  height:180px;
  display:grid;
  place-items:center;
  font-size:62px;
}

.sound{
  background:linear-gradient(135deg,#30175a,#11152a);
}

.video{
  background:linear-gradient(135deg,#1d4668,#11152a);
}

.three{
  background:linear-gradient(135deg,#174d49,#11152a);
}

.frame{
  background:linear-gradient(135deg,#61451d,#15131a);
}

.gift{
  background:linear-gradient(135deg,#6a254d,#17121b);
}

.info{
  padding:18px;
}

.info h3{
  margin:0 0 8px;
  font-size:20px;
}

.info p{
  color:#9da2b0;
  line-height:1.6;
  min-height:42px;
}

.price{
  font-size:21px;
  font-weight:900;
  margin-top:13px;
}

.add{
  width:100%;
  margin-top:14px;
  padding:12px;
  border:0;
  border-radius:12px;
  background:#fff;
  color:#111;
  font-weight:900;
  cursor:pointer;
}

/* ================= FOOTER ================= */

footer{
  text-align:center;
  padding:35px 6%;
  border-top:1px solid #20232d;
  color:#747988;
}

/* ================= CART ================= */

.cartBox{
  position:fixed;
  top:0;
  right:-100%;
  width:min(420px,92%);
  height:100vh;
  background:#101219;
  z-index:100;
  box-shadow:-15px 0 50px #0009;
  transition:.3s;
  display:flex;
  flex-direction:column;
}

.cartBox.open{
  right:0;
}

.cartHead{
  padding:20px;
  border-bottom:1px solid #292d38;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.cartHead h2{
  margin:0;
}

.close{
  background:#242732;
  color:#fff;
  border:0;
  border-radius:10px;
  padding:8px 12px;
  font-size:18px;
  cursor:pointer;
}

.cartItems{
  flex:1;
  overflow:auto;
  padding:15px;
}

.empty{
  text-align:center;
  color:#888;
  margin-top:60px;
}

.cartItem{
  background:#181b24;
  border:1px solid #292d38;
  border-radius:14px;
  padding:13px;
  margin-bottom:12px;
}

.cartItem strong{
  display:block;
  margin-bottom:8px;
}

.itemPrice{
  color:#caa7ff;
  font-weight:bold;
}

.controls{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:10px;
}

.controls button{
  width:32px;
  height:32px;
  border:0;
  border-radius:8px;
  background:#292d38;
  color:#fff;
  font-size:18px;
  cursor:pointer;
}

.remove{
  margin-right:auto;
  background:#4b2027!important;
  color:#ffb5bd!important;
  font-size:13px!important;
  width:auto!important;
  padding:0 10px;
}

.total{
  padding:18px;
  border-top:1px solid #292d38;
  background:#0c0e13;
}

.totalRow{
  display:flex;
  justify-content:space-between;
  font-size:20px;
  font-weight:bold;
  margin-bottom:14px;
}

.checkout{
  width:100%;
  padding:13px;
  border:0;
  border-radius:12px;
  background:#25D366;
  color:#fff;
  font-weight:900;
  cursor:pointer;
  font-size:16px;
}

.overlay{
  position:fixed;
  inset:0;
  background:#0008;
  z-index:90;
  display:none;
}

.overlay.show{
  display:block;
}

/* ================= MESSAGE ================= */

#msg{
  position:fixed;
  bottom:22px;
  left:5%;
  right:5%;
  z-index:120;
  background:#fff;
  color:#111;
  padding:15px;
  border-radius:14px;
  text-align:center;
  font-weight:bold;
  display:none;
  box-shadow:0 15px 40px #0009;
}


/* ================= LARGE VIDEO MODAL ================= */

.videoPreview{
  width:100%;
  height:100%;
  position:relative;
  cursor:pointer;
  background:#08090c;
  overflow:hidden;
}

.videoPreview .productSprite{
  transition:transform .3s ease,filter .3s ease;
}

.videoPreview:hover .productSprite{
  transform:scale(1.04);
  filter:brightness(1.08);
}

.videoPreviewPlay{
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  background:linear-gradient(180deg,transparent 35%,rgba(0,0,0,.55));
  font-size:48px;
  text-shadow:0 5px 25px #000;
}

.videoPreviewLabel{
  position:absolute;
  bottom:12px;
  right:12px;
  padding:7px 11px;
  border-radius:10px;
  background:#080a10e8;
  border:1px solid #4a5168;
  font-size:12px;
  font-weight:900;
}

.videoModal{
  position:fixed;
  inset:0;
  z-index:200;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:rgba(0,0,0,.88);
  backdrop-filter:blur(8px);
}

.videoModal.open{
  display:flex;
}

.videoModalBox{
  width:min(960px,96vw);
  max-height:94vh;
  background:#0d0f15;
  border:1px solid #343949;
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 25px 80px #000;
  position:relative;
}

.videoModal video{
  display:block;
  width:100%;
  max-height:82vh;
  background:#000;
  object-fit:contain;
}

.videoModalClose{
  position:absolute;
  top:10px;
  left:10px;
  z-index:3;
  width:42px;
  height:42px;
  border:1px solid #ffffff44;
  border-radius:50%;
  background:#111827dd;
  color:#fff;
  font-size:26px;
  cursor:pointer;
}

.videoModalTitle{
  padding:13px 18px;
  font-weight:900;
  color:#fff;
}

@media(max-width:600px){
  .videoModal{
    padding:8px;
  }

  .videoModalBox{
    width:100%;
    border-radius:16px;
  }

  .videoModal video{
    max-height:78vh;
  }
}

/* ================= MOBILE ================= */

@media(max-width:600px){

  header{
    padding:13px 5%;
  }

  .hero{
    min-height:680px;
    padding:35px 5%;
    align-items:flex-end;

    background:
      linear-gradient(
        180deg,
        rgba(5,5,5,.02) 0%,
        rgba(5,5,5,.12) 35%,
        rgba(5,5,5,.45) 58%,
        #050505 90%
      ),
      url("./file_00000000b4608243b58dced485d619f0.png")
      center top / 100% auto
      no-repeat;

    background-color:#050505;
  }

  .hero::after{
    background:
      linear-gradient(
        180deg,
        transparent 50%,
        #070707 100%
      );
  }

  .heroContent{
    width:100%;
  }

  .hero p{
    font-size:16px;
    line-height:1.8;
  }

  .products{
    grid-template-columns:1fr 1fr;
    padding-left:5%;
    padding-right:5%;
  }

  .pic{
    height:140px;
    font-size:48px;
  }

  .info{
    padding:13px;
  }

  .info h3{
    font-size:17px;
  }

  .info p{
    font-size:13px;
  }

  .price{
    font-size:18px;
  }

  .filters{
    padding-left:5%;
    padding-right:5%;
  }
}

@media(max-width:390px){

  .products{
    grid-template-columns:1fr;
  }

}
.productVideo{width:100%;height:100%;display:block;object-fit:cover;background:#08090c;border:0}.videoWrap{position:relative;width:100%;height:100%;background:#08090c}.videoWrap .mediaBadge{z-index:2}.animated-frame{background:linear-gradient(135deg,#61451d,#15131a)}.animated-image{background:linear-gradient(135deg,#30175a,#11152a)}.custom-entry{background:linear-gradient(135deg,#174d49,#11152a)}.productVisual{height:180px;position:relative;overflow:hidden;background:#08090c}.productSprite{position:absolute;inset:0;background-image:url('./products/silva-sprite.jpg');background-size:200% 200%;background-repeat:no-repeat}.sprite0{background-position:0 0}.sprite1{background-position:100% 0}.sprite2{background-position:0 100%}.sprite3{background-position:100% 100%}.mediaBadge{position:absolute;top:12px;right:12px;padding:7px 10px;border-radius:10px;background:#0b1020e8;color:#fff;font-size:12px;font-weight:900;border:1px solid #3d4661}.playBadge{position:absolute;inset:0;display:grid;place-items:center;font-size:34px;color:#fff;text-shadow:0 4px 20px #000;background:radial-gradient(circle,rgba(35,91,220,.75),rgba(10,15,30,.08) 28%,transparent 55%)}@media(max-width:600px){.productVisual{height:140px}}
</style>
</head>

<body>

<!-- ================= HEADER ================= -->

<header>

  <div class="logo">
    SILVA
  </div>

  <button class="cart" onclick="openCart()">
    🛒 السلة
    <span id="count">0</span>
  </button>

</header>


<!-- ================= HERO ================= -->

<section class="hero">

  <div class="heroContent">

    <span class="badge">
      ✦ متجر رقمي مميز
    </span>

    <h1>
      SILVA
    </h1>

    <h2>
      متجرك الرقمي الراقي
    </h2>

    <p>
      اكتشف مجموعة مختارة من المنتجات الرقمية المميزة
      المصممة لإضافة لمسة احترافية وإبداعية إلى مشاريعك.
    </p>

    <a class="btn" href="#products">
      تصفح المنتجات
    </a>

  </div>

</section>


<!-- ================= PRODUCTS ================= -->

<section id="products">

  <div class="title">

    <h2>
      منتجاتنا
    </h2>

    <p>
      اختيارات رقمية مميزة لك
    </p>

  </div>


  <div class="filters">

    <button class="filter active" onclick="filterProducts('all',this)">
      الكل
    </button>

    <button class="filter" onclick="filterProducts('إطارات متحركة',this)">
      إطارات متحركة
    </button>

    <button class="filter" onclick="filterProducts('صور متحركة',this)">
      صور متحركة
    </button>

    <button class="filter" onclick="filterProducts('دخوليات مخصصة',this)">
      دخوليات مخصصة
    </button>

  </div>


  <main class="products" id="productList"></main>

</section>


<!-- ================= FOOTER ================= -->

<footer>

  Silva © 2026 — متجرك الرقمي الراقي

</footer>


<!-- ================= CART ================= -->

<div
  class="overlay"
  id="overlay"
  onclick="closeCart()">
</div>


<div
  class="cartBox"
  id="cartBox">

  <div class="cartHead">

    <h2>
      🛒 سلة المشتريات
    </h2>

    <button
      class="close"
      onclick="closeCart()">
      ×
    </button>

  </div>


  <div
    class="cartItems"
    id="cartItems">
  </div>


  <div class="total">

    <div class="totalRow">

      <span>
        المجموع
      </span>

      <span>
        $
        <span id="total">
          0.00
        </span>
      </span>

    </div>


    <button
      class="checkout"
      onclick="checkout()">

      🟢 إتمام الطلب عبر واتساب

    </button>

  </div>

</div>



<!-- ================= LARGE VIDEO MODAL ================= -->

<div class="videoModal" id="videoModal" onclick="closeVideoModal(event)">
  <div class="videoModalBox" onclick="event.stopPropagation()">
    <button class="videoModalClose" onclick="closeVideoModal()">×</button>
    <video id="largeVideo" controls playsinline preload="metadata"></video>
    <div class="videoModalTitle" id="largeVideoTitle"></div>
  </div>
</div>


<!-- ================= MESSAGE ================= -->

<div id="msg"></div>


<script>

/* ================= PRODUCTS DATA ================= */

const items = [
  {id:0,icon:"👑",name:"إطار النخبة الملكي",description:"إطار متحرك فاخر بلمسة ملكية",price:15,category:"إطارات متحركة",className:"animated-frame",video:"./VID-20261007-WA0078.mp4",imagePos:0},
  {id:1,icon:"✨",name:"هوية الذهب الفاخرة",description:"صورة متحركة بتصميم ذهبي راقٍ",price:10,category:"صور متحركة",className:"animated-image",video:"./VID_20261004153205202.mp4",imagePos:1},
  {id:2,icon:"🖤",name:"هوية النخبة الذهبية",description:"صورة متحركة أنيقة بطابع فاخر",price:10,category:"صور متحركة",className:"animated-image",video:"./lv_0_20261004143659.mp4",imagePos:2},
  {id:3,icon:"🔥",name:"VIP 8 — التاج الأسطوري",description:"إطار VIP متحرك فاخر بتصميم ملكي",price:15,category:"إطارات متحركة",className:"animated-frame",video:"./lv_0_٢٠٢٦٠٩٠٧٠٣٤١٣٥.mp4",imagePos:3},
  {id:4,icon:"🚪",name:"دخولية مخصصة",description:"دخولية مصممة خصيصًا حسب طلبك",price:20,category:"دخوليات مخصصة",className:"custom-entry",video:null,imagePos:null}
]


/* ================= CART ================= */

let cart = [];


/* ================= DISPLAY PRODUCTS ================= */

function renderProducts(list = items){

  const productList =
    document.getElementById("productList");

  productList.innerHTML = list.map(product => `

    <article class="card">

      <div class="productVisual ${product.className}">
        ${product.video ? `<div class="videoPreview" onclick="openVideoModal(${product.id})" role="button" tabindex="0" aria-label="فتح فيديو ${product.name} بحجم كبير"><div class="productSprite sprite${product.imagePos ?? 0}"></div><span class="videoPreviewPlay">▶</span><span class="videoPreviewLabel">🎬 مشاهدة بحجم كبير</span></div>` : `<div class="pic ${product.className}" style="height:100%;font-size:58px">${product.icon}</div>`}
      </div>

      <div class="info">

        <h3>
          ${product.name}
        </h3>

        <p>
          ${product.description}
        </p>

        <div class="price">
          ${product.price > 0 ? "$" + product.price.toFixed(2) : "حسب الطلب"}
        </div>

        <button
          class="add"
          onclick="add(${product.id})">

          أضف للسلة

        </button>

      </div>

    </article>

  `).join("");

}



/* ================= LARGE VIDEO ================= */

function openVideoModal(id){
  const product = items.find(item => item.id === id);
  if(!product || !product.video) return;

  const modal = document.getElementById("videoModal");
  const video = document.getElementById("largeVideo");
  const title = document.getElementById("largeVideoTitle");

  title.textContent = product.name;
  video.src = product.video;
  modal.classList.add("open");
  document.body.style.overflow = "hidden";

  video.currentTime = 0;
  video.play().catch(() => {});
}

function closeVideoModal(event){
  if(event && event.target && event.target.id !== "videoModal") return;

  const modal = document.getElementById("videoModal");
  const video = document.getElementById("largeVideo");

  video.pause();
  video.removeAttribute("src");
  video.load();

  modal.classList.remove("open");
  document.body.style.overflow = "";
}

/* ================= FILTER ================= */

function filterProducts(category,button){

  document
    .querySelectorAll(".filter")
    .forEach(btn => {
      btn.classList.remove("active");
    });

  button.classList.add("active");


  if(category === "all"){

    renderProducts(items);

    return;
  }


  const filtered =
    items.filter(
      product => product.category === category
    );

  renderProducts(filtered);

}


/* ================= ADD ================= */

function add(id){

  const found =
    cart.find(item => item.id === id);


  if(found){

    found.qty++;

  }else{

    cart.push({
      id:id,
      qty:1
    });

  }


  updateCart();

  show("تمت إضافة المنتج إلى السلة ✓");

}


/* ================= CHANGE QUANTITY ================= */

function changeQty(id,value){

  const item =
    cart.find(item => item.id === id);


  if(!item){
    return;
  }


  item.qty += value;


  if(item.qty <= 0){

    cart =
      cart.filter(
        item => item.id !== id
      );

  }


  updateCart();

}


/* ================= REMOVE ================= */

function removeItem(id){

  cart =
    cart.filter(
      item => item.id !== id
    );

  updateCart();

}


/* ================= UPDATE CART ================= */

function updateCart(){

  const totalCount =
    cart.reduce(
      (sum,item) => sum + item.qty,
      0
    );


  document.getElementById("count")
    .textContent = totalCount;


  const box =
    document.getElementById("cartItems");


  if(cart.length === 0){

    box.innerHTML =
      '<div class="empty">السلة فارغة 🛒</div>';

    document.getElementById("total")
      .textContent = "0.00";

    return;
  }


  let total = 0;


  box.innerHTML =
    cart.map(item => {

      const product =
        items.find(
          product => product.id === item.id
        );


      const subtotal =
        product.price * item.qty;


      total += subtotal;


      return `

        <div class="cartItem">

          <strong>
            ${product.icon}
            ${product.name}
          </strong>

          <div class="itemPrice">
            ${product.price > 0 ? "$" + product.price.toFixed(2) + " للقطعة" : "السعر حسب الطلب"}
          </div>

          <div class="controls">

            <button
              onclick="changeQty(${product.id},-1)">
              −
            </button>

            <span>
              ${item.qty}
            </span>

            <button
              onclick="changeQty(${product.id},1)">
              +
            </button>

            <button
              class="remove"
              onclick="removeItem(${product.id})">

              حذف

            </button>

          </div>

        </div>

      `;

    }).join("");


  document.getElementById("total")
    .textContent = total.toFixed(2);

}


/* ================= OPEN CART ================= */

function openCart(){

  document
    .getElementById("cartBox")
    .classList.add("open");


  document
    .getElementById("overlay")
    .classList.add("show");


  updateCart();

}


/* ================= CLOSE CART ================= */

function closeCart(){

  document
    .getElementById("cartBox")
    .classList.remove("open");


  document
    .getElementById("overlay")
    .classList.remove("show");

}


/* ================= WHATSAPP CHECKOUT ================= */

function checkout(){

  if(cart.length === 0){

    show("السلة فارغة 🛒");

    return;
  }


  let lines = [];


  lines.push(
